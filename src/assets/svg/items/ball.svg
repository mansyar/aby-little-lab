<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="beachBall">
      <circle cx="256" cy="256" r="172"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="175" fill="#FFFFFF" stroke="#2D3748" stroke-width="6"/>

  <!-- Beach-ball gores: longitude boundaries at x = 256 + 172 sin(theta), so the
       middle panels are wide and the edge panels narrow, as on a real ball. -->
  <g clip-path="url(#beachBall)">
    <path d="M 256 84 C 174 84 107 161 107 256 C 107 351 174 428 256 428
             C 209 428 170 351 170 256 C 170 161 209 84 256 84 Z" fill="#E53E3E"/>
    <path d="M 256 84 L 256 428 L 256 428
             C 304 428 342 351 342 256 C 342 161 304 84 256 84 Z" fill="#3182CE"/>
    <path d="M 256 84 C 338 84 405 161 405 256 C 405 351 338 428 256 428
             C 374 428 470 351 470 256 C 470 161 374 84 256 84 Z" fill="#F6AD55"/>
  </g>

  <!-- Seams between the gores. -->
  <g fill="none" stroke="#2D3748" stroke-width="4">
    <path d="M 256 84 C 174 84 107 161 107 256 C 107 351 174 428 256 428"/>
    <path d="M 256 84 C 209 84 170 161 170 256 C 170 351 209 428 256 428"/>
    <path d="M 256 84 L 256 428"/>
    <path d="M 256 84 C 304 84 342 161 342 256 C 342 351 304 428 256 428"/>
    <path d="M 256 84 C 338 84 405 161 405 256 C 405 351 338 428 256 428"/>
  </g>

  <!-- Poles and a soft specular sheen. -->
  <ellipse cx="256" cy="90" rx="24" ry="9" fill="#F7FAFC" stroke="#2D3748" stroke-width="4"/>
  <ellipse cx="256" cy="422" rx="24" ry="9" fill="#F7FAFC" stroke="#2D3748" stroke-width="4"/>
  <path d="M 128 200 Q 158 146 216 112" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#2D3748" stroke-width="6"/>
</svg>
