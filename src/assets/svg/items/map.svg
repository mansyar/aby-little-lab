<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Parchment base -->
  <rect x="60" y="90" width="392" height="320" rx="18" fill="#FFF8E7" stroke="#2D3748" stroke-width="6"/>
  <rect x="72" y="102" width="368" height="296" rx="12" fill="#FEEBC8" stroke="#2D3748" stroke-width="4"/>
  <line x1="316" y1="102" x2="316" y2="398" stroke="#ED8936" stroke-width="3" stroke-dasharray="12 8" opacity="0.7"/>

  <!-- Landmasses: deliberately uneven in size and position, with ragged
       coastlines, so the trio never groups into a face. -->
  <path d="M 96 154 Q 124 126 156 138 Q 184 122 206 142 Q 222 160 208 182
           Q 226 196 216 220 Q 206 244 176 248 Q 148 258 126 240
           Q 104 224 108 196 Q 88 174 96 154 Z"
        fill="#68D391" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 308 190 Q 326 174 348 182 Q 362 194 350 210 Q 336 224 316 216
           Q 302 204 308 190 Z"
        fill="#68D391" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 300 330 Q 314 318 330 326 Q 340 336 330 348 Q 316 358 302 350
           Q 292 340 300 330 Z"
        fill="#F6AD55" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>

  <!-- Dashed route: one long S-curve from the start dot to the X. -->
  <path d="M 130 352 C 168 322 190 372 222 340 C 250 312 270 332 296 316
           C 318 302 340 306 356 296"
        stroke="#E53E3E" stroke-width="5" fill="none" stroke-dasharray="11 8" stroke-linecap="round"/>
  <circle cx="130" cy="352" r="9" fill="#E53E3E" stroke="#2D3748" stroke-width="3"/>

  <!-- X marks the spot -->
  <g stroke="#E53E3E" stroke-width="6" stroke-linecap="round">
    <line x1="352" y1="282" x2="380" y2="310"/>
    <line x1="380" y1="282" x2="352" y2="310"/>
  </g>
  <circle cx="366" cy="296" r="22" fill="none" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Compass rose, clear of the islands -->
  <circle cx="390" cy="130" r="30" fill="#FFFFFF" stroke="#2D3748" stroke-width="5"/>
  <polygon points="390,104 396,130 390,156 384,130" fill="#2D3748"/>
  <polygon points="364,130 390,124 416,130 390,136" fill="#A0AEC0"/>
  <circle cx="390" cy="130" r="6" fill="#2D3748"/>
</svg>
