<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Parchment base — aged cream with folded edges -->
  <rect x="60" y="90" width="392" height="320" rx="18" fill="#FFF8E7" stroke="#2D3748" stroke-width="6"/>
  <rect x="72" y="102" width="368" height="296" rx="12" fill="#FEEBC8" stroke="#2D3748" stroke-width="4"/>
  <!-- Fold lines -->
  <line x1="200" y1="102" x2="200" y2="398" stroke="#ED8936" stroke-width="3" stroke-dasharray="12 8" opacity="0.7"/>
  <line x1="340" y1="102" x2="340" y2="398" stroke="#ED8936" stroke-width="3" stroke-dasharray="12 8" opacity="0.7"/>
  <!-- Land shapes — green islands -->
  <path d="M 120 180 Q 160 140 200 180 Q 230 210 200 250 Q 150 280 110 240 Z" fill="#68D391" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 300 160 Q 360 150 380 200 Q 370 250 320 260 Q 260 240 300 160 Z" fill="#68D391" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 180 300 Q 220 320 260 300 Q 280 340 230 360 Q 160 350 180 300 Z" fill="#F6AD55" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <!-- Dashed treasure path -->
  <path d="M 140 210 Q 200 230 250 200 Q 300 170 350 220" stroke="#E53E3E" stroke-width="4" fill="none" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- X marks the spot -->
  <g stroke="#E53E3E" stroke-width="5" stroke-linecap="round">
    <line x1="360" y1="300" x2="390" y2="330"/>
    <line x1="390" y1="300" x2="360" y2="330"/>
  </g>
  <circle cx="375" cy="315" r="22" fill="none" stroke="#E53E3E" stroke-width="4" stroke-dasharray="6 4"/>
  <!-- Compass rose — top right -->
  <circle cx="390" cy="145" r="32" fill="white" stroke="#2D3748" stroke-width="5"/>
  <polygon points="390,118 396,145 390,172 384,145" fill="#2D3748"/>
  <polygon points="363,145 390,139 417,145 390,151" fill="#A0AEC0"/>
  <circle cx="390" cy="145" r="6" fill="#2D3748"/>
</svg>
