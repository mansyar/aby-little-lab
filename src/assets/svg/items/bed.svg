<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Wooden headboard -->
  <rect x="80" y="140" width="352" height="80" rx="12" fill="#8B5A2B" stroke="#2D3748" stroke-width="6"/>
  <rect x="95" y="155" width="322" height="50" rx="8" fill="#A67C52" stroke="#2D3748" stroke-width="4"/>
  <!-- Bed frame sides -->
  <rect x="80" y="220" width="20" height="160" rx="6" fill="#8B5A2B" stroke="#2D3748" stroke-width="5"/>
  <rect x="412" y="220" width="20" height="160" rx="6" fill="#8B5A2B" stroke="#2D3748" stroke-width="5"/>
  <!-- Mattress base -->
  <rect x="60" y="300" width="392" height="40" rx="8" fill="#D69E2E" stroke="#2D3748" stroke-width="6"/>
  <!-- Mattress top -->
  <rect x="70" y="280" width="372" height="50" rx="10" fill="white" stroke="#2D3748" stroke-width="5"/>
  <!-- Blanket - soft blue -->
  <rect x="70" y="320" width="372" height="50" rx="8" fill="#63B3ED" stroke="#2D3748" stroke-width="5"/>
  <rect x="85" y="335" width="342" height="20" rx="6" fill="#90CDF4"/>
  <!-- Pillow - white with light shadow -->
  <rect x="110" y="235" width="130" height="70" rx="16" fill="white" stroke="#2D3748" stroke-width="5"/>
  <ellipse cx="175" cy="255" rx="40" ry="14" fill="#E2E8F0"/>
  <!-- Pillow seam -->
  <line x1="115" y1="270" x2="235" y2="270" stroke="#A0AEC0" stroke-width="3" stroke-linecap="round"/>
  <!-- Blanket fold highlight -->
  <path d="M 70 345 Q 250 365 442 345" stroke="#2D3748" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- Legs -->
  <rect x="85" y="340" width="18" height="50" rx="6" fill="#5D3A1A" stroke="#2D3748" stroke-width="4"/>
  <rect x="409" y="340" width="18" height="50" rx="6" fill="#5D3A1A" stroke="#2D3748" stroke-width="4"/>
</svg>
