<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ear tufts -->
  <polygon points="182,118 214,52 240,104" fill="#D69E2E" stroke="#2D3748" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="330,118 298,52 272,104" fill="#D69E2E" stroke="#2D3748" stroke-width="6" stroke-linejoin="round"/>
  <!-- body -->
  <circle cx="256" cy="292" r="165" fill="#D69E2E" stroke="#2D3748" stroke-width="8"/>
  <!-- wings (raised) -->
  <ellipse cx="118" cy="238" rx="40" ry="78" fill="#C0801F" stroke="#2D3748" stroke-width="6" transform="rotate(-32 118 238)"/>
  <ellipse cx="394" cy="238" rx="40" ry="78" fill="#C0801F" stroke="#2D3748" stroke-width="6" transform="rotate(32 394 238)"/>
  <!-- belly -->
  <ellipse cx="256" cy="336" rx="108" ry="100" fill="#F6AD55" stroke="#2D3748" stroke-width="5"/>
  <!-- lab coat -->
  <ellipse cx="256" cy="384" rx="130" ry="70" fill="#FFF8E7" stroke="#2D3748" stroke-width="6"/>
  <!-- coat lapels -->
  <polygon points="222,320 256,352 290,320" fill="#FFF8E7" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <!-- coat pocket and pen -->
  <rect x="302" y="368" width="54" height="42" rx="7" fill="#FFF8E7" stroke="#2D3748" stroke-width="4"/>
  <rect x="324" y="352" width="11" height="28" rx="3" fill="#4FD1C5" stroke="#2D3748" stroke-width="3"/>
  <!-- feet -->
  <ellipse cx="198" cy="452" rx="32" ry="14" fill="#ED8936" stroke="#2D3748" stroke-width="5"/>
  <ellipse cx="314" cy="452" rx="32" ry="14" fill="#ED8936" stroke="#2D3748" stroke-width="5"/>
  <!-- eyes (happy arcs) -->
  <path d="M 170 236 Q 203 208 236 236" fill="none" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
  <path d="M 276 236 Q 309 208 342 236" fill="none" stroke="#2D3748" stroke-width="6" stroke-linecap="round"/>
  <!-- pupils -->
  <circle cx="203" cy="256" r="24" fill="#2D3748"/>
  <circle cx="309" cy="256" r="24" fill="#2D3748"/>
  <!-- glints -->
  <circle cx="209" cy="248" r="8" fill="#FFF8E7"/>
  <circle cx="315" cy="248" r="8" fill="#FFF8E7"/>
  <!-- open happy beak -->
  <path d="M 256 282 Q 256 318 232 314 Q 256 330 280 314 Q 256 318 256 282 Z" fill="#ED8936" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
</svg>
