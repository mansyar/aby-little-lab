<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ear tufts -->
  <polygon points="182,118 214,52 240,104" fill="#D69E2E" stroke="#2D3748" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="330,118 298,52 272,104" fill="#D69E2E" stroke="#2D3748" stroke-width="6" stroke-linejoin="round"/>
  <!-- body -->
  <circle cx="256" cy="292" r="165" fill="#D69E2E" stroke="#2D3748" stroke-width="8"/>
  <!-- wings (down) -->
  <ellipse cx="118" cy="318" rx="40" ry="78" fill="#C0801F" stroke="#2D3748" stroke-width="6" transform="rotate(18 118 318)"/>
  <ellipse cx="394" cy="318" rx="40" ry="78" fill="#C0801F" stroke="#2D3748" stroke-width="6" transform="rotate(-18 394 318)"/>
  <!-- belly -->
  <ellipse cx="256" cy="336" rx="108" ry="100" fill="#F6AD55" stroke="#2D3748" stroke-width="5"/>
  <!-- lab coat -->
  <ellipse cx="256" cy="384" rx="130" ry="70" fill="#FFF8E7" stroke="#2D3748" stroke-width="6"/>
  <!-- coat lapels -->
  <polygon points="222,320 256,352 290,320" fill="#FFF8E7" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
  <!-- coat pocket and pen -->
  <rect x="302" y="368" width="54" height="42" rx="7" fill="#FFF8E7" stroke="#2D3748" stroke-width="4"/>
  <rect x="324" y="352" width="11" height="28" rx="3" fill="#4FD1C5" stroke="#2D3748" stroke-width="3"/>
  <!-- feet -->
  <ellipse cx="198" cy="452" rx="32" ry="14" fill="#ED8936" stroke="#2D3748" stroke-width="5"/>
  <ellipse cx="314" cy="452" rx="32" ry="14" fill="#ED8936" stroke="#2D3748" stroke-width="5"/>
  <!-- eyes -->
  <circle cx="203" cy="240" r="56" fill="#FFF8E7" stroke="#2D3748" stroke-width="6"/>
  <circle cx="309" cy="240" r="56" fill="#FFF8E7" stroke="#2D3748" stroke-width="6"/>
  <!-- pupils -->
  <circle cx="214" cy="246" r="25" fill="#2D3748"/>
  <circle cx="298" cy="246" r="25" fill="#2D3748"/>
  <!-- glints -->
  <circle cx="220" cy="238" r="8" fill="#FFF8E7"/>
  <circle cx="304" cy="238" r="8" fill="#FFF8E7"/>
  <!-- beak -->
  <polygon points="256,276 238,308 274,308" fill="#ED8936" stroke="#2D3748" stroke-width="5" stroke-linejoin="round"/>
</svg>
