  <rect x="98" y="300" width="96" height="78" rx="18" fill="#FFFFFF" stroke="#2D3748" stroke-width="6"/>
  <text x="146" y="345" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2', sans-serif" font-size="42" font-weight="800" fill="#2B6CB0" stroke="#2D3748" stroke-width="3.5" paint-order="stroke">1</text>
  <rect x="208" y="250" width="96" height="118" rx="18" fill="#FFFFFF" stroke="#2D3748" stroke-width="6"/>
