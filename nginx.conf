server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers live in one snippet because nginx inherits `add_header` from
  # this block only into a location that declares none — so every location below
  # that sets `Cache-Control` includes it again, or it would serve with no policy.
  include /etc/nginx/snippets/security-headers.conf;

  # Service-worker and shell files must be revalidated so PWA updates are detected.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Vite-generated hashed assets can be cached for a long time.
  location ~* \.(?:css|js|png|svg|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # BGM is precached by the service worker but is not content-hashed.
  location ~* \.mp3$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
