# Security headers for Aby's Little Lab — an nginx snippet, never a server block.
#
# `nginx.conf` pulls this file in with
#   include /etc/nginx/snippets/security-headers.conf;
# in the `server` block and again inside every `location` that declares its own
# `add_header`. That repetition is not decoration: nginx inherits `add_header`
# from an enclosing block only into a location that declares none of its own, so
# a header set once at server level would silently vanish from `/sw.js`,
# `/index.html`, `/manifest.webmanifest`, every hashed asset and every `.mp3` —
# that is, from nearly every request the app makes.
#
# `always` is the other half. Without it nginx drops these headers from 4xx and
# 5xx responses, so a mistyped asset URL would answer with a body carrying
# neither `nosniff` nor a policy — the one response a proxy or a curious client
# is most likely to be handed.
#
# The policy is strict on purpose, and the artifact was inspected before it was
# chosen: `dist/index.html` holds one module script, one stylesheet, one
# modulepreload and the manifest link and nothing inline; neither emitted bundle
# contains `eval(`, `new Function(`, `createElement("style")`,
# `createElement("script")` or `insertRule`. So `'unsafe-inline'` and
# `'unsafe-eval'` are unnecessary, not merely unfashionable — and since they are
# what a CSP is usually weakened to, their absence is the property the guard
# test refuses to let drift.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), midi=(), display-capture=(), accelerometer=(), gyroscope=(), magnetometer=()" always;

# Why each CSP directive is what it is:
#
#   default-src 'self'      — the floor. Nothing is loaded from anywhere else.
#   script-src 'self'       — the shell chunk, the Phaser vendor chunk and the
#                             lazy game chunks are all same-origin files. The
#                             service worker's `importScripts('/workbox-*.js')`
#                             is same-origin too, so it needs no exception.
#   style-src 'self'        — one emitted stylesheet. Phaser assigns through
#                             the CSSOM (`element.style.*`), which CSP does not
#                             govern, and no bundle creates a `<style>` element.
#   img-src 'self' data:    — every generated artwork is a
#                             `data:image/svg+xml;base64,…` URI (svgDataUri.ts),
#                             so dropping `data:` would blank every hub tile.
#   font-src 'self'         — the bundled font files, nothing else.
#   media-src 'self'        — the background music, served from `/audio/`.
#   connect-src 'self'      — Workbox precaches from same-origin URLs, and those
#                             fetches run under the worker's own policy; the app
#                             makes no other network request.
#   worker-src 'self'       — the service worker is classic, registered from
#                             `/sw.js`; no `blob:` worker is created.
#   manifest-src 'self'     — `/manifest.webmanifest`.
#   object-src 'none'       — no plugin content exists, so none may load.
#   base-uri 'none'         — nothing may retarget relative URLs at runtime.
#   form-action 'none'      — the app submits no form to any origin.
#   frame-ancestors 'none'  — the app may not be framed; a meta tag could not
#                             express this at all, which is why the policy lives
#                             in nginx rather than in the HTML.
#
# Why `fullscreen` is deliberately absent from `Permissions-Policy`: the
# manifest requests `display_override: ["fullscreen", "standalone"]`, and a
# feature named with `=()` is denied outright. Leaving it unmentioned keeps the
# default (allowed for the top-level document), so the installed PWA can still
# go fullscreen — the one permission this app genuinely uses.
