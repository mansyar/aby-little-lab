<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hoot — Ligne Motion Proof</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #fff8e7;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        margin: 0;
      }
      canvas {
        background: #faf9f6;
        border: 4px solid #2d3748;
        border-radius: 12px;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 560px;
      }
      button {
        font-size: 16px;
        padding: 10px 14px;
        border: 3px solid #2d3748;
        border-radius: 10px;
        background: #fffdf7;
        cursor: pointer;
      }
      button:hover { background: #f6ad55; }
      #status { color: #2d3748; margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="hoot" width="512" height="512"></canvas>
    <div id="controls"></div>
    <p id="status">Loading…</p>
    <!-- Dev-only harness: not part of the production build (root index.html
         remains the sole build entry). -->
    <script type="module" src="/src/preview/ligne-hoot.ts"></script>
  </body>
</html>
