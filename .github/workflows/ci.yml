name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore: ['conductor/**', 'docs/**', 'README.md', '**/*.md']

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tells the job whether the PR touches anything but documentation. It
      # never fails: an unknown base, an empty diff or a fetch failure all fall
      # through to `code`, because running the suite needlessly costs minutes
      # while skipping it wrongly costs a merge.
      - name: Classify the change
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          emit() { echo "tier=$1" >> "$GITHUB_OUTPUT"; echo "Change tier: $1"; }
          if [ ! -f .node-version ]; then emit code; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base:-}" ]; then emit code; exit 0; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then emit code; exit 0; fi
          fi
          files="$(git diff --name-only "$base" HEAD || true)"
          if [ -z "$files" ]; then emit code; exit 0; fi
          tier=doc
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              conductor/*|docs/*|README.md|*.md) ;;
              *) tier=code; break ;;
            esac
          done <<< "$files"
          emit "$tier"

      - name: Setup pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node (from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one check that must also run for a documentation-only change: it is
      # what reads conductor/*.md, so skipping it would let a dead track link
      # merge with every check green.
      - name: Document validation
        run: node scripts/validate-docs.js

      - name: Lint & format check
        if: steps.changes.outputs.tier == 'code'
        run: pnpm run check

      - name: Typecheck
        if: steps.changes.outputs.tier == 'code'
        run: pnpm run typecheck

      - name: Tests
        if: steps.changes.outputs.tier == 'code'
        run: CI=true pnpm test

      - name: Production build
        if: steps.changes.outputs.tier == 'code'
        run: pnpm run build

      - name: Bundle validation
        if: steps.changes.outputs.tier == 'code'
        run: node scripts/validate-bundle.js

      - name: PWA validation
        if: steps.changes.outputs.tier == 'code'
        run: node scripts/validate-pwa.js

      - name: Boot-time validation
        if: steps.changes.outputs.tier == 'code'
        run: |
          node node_modules/vite/bin/vite.js preview --port 4173 --strictPort &
          sleep 3
          node scripts/validate-boot.js

      # The policy is only proven by a container. The guard test reads
      # `nginx.conf` and the snippet as text; this step asserts what nginx
      # actually sends, on every route class, from the image Coolify builds.
      # Docker missing is an error rather than a skip: a silently skipped check
      # would make "every code change is validated" mean nothing, which is the
      # whole of AC-7. The image is built here, not reused, because a cache hit
      # from another job could hide a snippet the Dockerfile no longer copies.
      - name: Security headers
        if: steps.changes.outputs.tier == 'code'
        run: |
          command -v docker >/dev/null 2>&1 || { echo "::error::Docker is required to validate the security headers"; exit 1; }
          docker build -t aby-little-lab:headers .
          node scripts/validate-headers.js

  e2e:
    name: Browser Journeys
    # A separate job after the quality gates, not a step inside them, so a
    # browser failure does not hide static/unit results and a hung browser
    # cannot stall the gate. It still needs `dist`, which `pnpm test:e2e`
    # builds itself (`pnpm build && playwright test`), keeping the artifact
    # local to the job that tests it. NFR-2's budget is 5 min for the suite;
    # the timeout below is only the backstop for a browser that never exits.
    # A documentation-only change runs no test here, but the job still runs and
    # still reports: both required checks must report or the PR stays blocked.
    needs: quality-gates
    runs-on: ubuntu-latest
    # A hung browser should fail loudly instead of occupying a runner.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify the change
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          emit() { echo "tier=$1" >> "$GITHUB_OUTPUT"; echo "Change tier: $1"; }
          if [ ! -f .node-version ]; then emit code; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base:-}" ]; then emit code; exit 0; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then emit code; exit 0; fi
          fi
          files="$(git diff --name-only "$base" HEAD || true)"
          if [ -z "$files" ]; then emit code; exit 0; fi
          tier=doc
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              conductor/*|docs/*|README.md|*.md) ;;
              *) tier=code; break ;;
            esac
          done <<< "$files"
          emit "$tier"

      - name: Setup pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node (from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.tier == 'code'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.changes.outputs.tier == 'code'
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser journeys
        if: steps.changes.outputs.tier == 'code'
        run: pnpm test:e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to Coolify
    needs: quality-gates
    # Deploys only on strict semver version-tag pushes (e.g. v1.9.0), and only
    # if the tag points to a commit on master (master lineage guard below).
    # PRs and master pushes never deploy. Requires repository secrets:
    #   COOLIFY_DEPLOY_WEBHOOK - Coolify -> Application -> Webhooks -> Deploy Webhook URL
    #   COOLIFY_TOKEN         - Coolify -> Keys & Tokens -> API token with 'deploy' permission
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag points to a master commit
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit not on master; refusing to deploy."
            exit 1
          fi

      - name: Verify deploy secrets are configured
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: env.DEPLOY_WEBHOOK == '' || env.COOLIFY_TOKEN == ''
        run: |
          echo "::error title=Missing secrets::Set COOLIFY_DEPLOY_WEBHOOK (Coolify deploy webhook URL) and COOLIFY_TOKEN (Coolify API token with deploy permission) under Settings -> Secrets and variables -> Actions, then re-run this job."
          exit 1

      - name: Trigger Coolify deploy webhook
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
