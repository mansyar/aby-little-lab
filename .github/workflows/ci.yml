name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore: ['conductor/**', 'docs/**', 'README.md', '**/*.md']

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tells the job whether the PR touches anything but documentation. It
      # never fails: an unknown base, an empty diff or a fetch failure all fall
      # through to `code`, because running the suite needlessly costs minutes
      # while skipping it wrongly costs a merge.
      - name: Classify the change
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          emit() { echo "tier=$1" >> "$GITHUB_OUTPUT"; echo "Change tier: $1"; }
          if [ ! -f .node-version ]; then emit code; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base:-}" ]; then emit code; exit 0; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then emit code; exit 0; fi
          fi
          files="$(git diff --name-only "$base" HEAD || true)"
          if [ -z "$files" ]; then emit code; exit 0; fi
          tier=doc
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              conductor/*|docs/*|README.md|*.md) ;;
              *) tier=code; break ;;
            esac
          done <<< "$files"
          emit "$tier"

      - name: Setup pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node (from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one check that must also run for a documentation-only change: it is
      # what reads conductor/*.md, so skipping it would let a dead track link
      # merge with every check green.
      - name: Document validation
        run: node scripts/validate-docs.js

      - name: Lint & format check
        if: steps.changes.outputs.tier == 'code'
        run: pnpm run check

      - name: Typecheck
        if: steps.changes.outputs.tier == 'code'
        run: pnpm run typecheck

      - name: Tests
        if: steps.changes.outputs.tier == 'code'
        run: CI=true pnpm test

      - name: Production build
        if: steps.changes.outputs.tier == 'code'
        run: pnpm run build

      - name: Bundle validation
        if: steps.changes.outputs.tier == 'code'
        run: node scripts/validate-bundle.js

      - name: PWA validation
        if: steps.changes.outputs.tier == 'code'
        run: node scripts/validate-pwa.js

      - name: Boot-time validation
        if: steps.changes.outputs.tier == 'code'
        run: |
          node node_modules/vite/bin/vite.js preview --port 4173 --strictPort &
          sleep 3
          node scripts/validate-boot.js

      # The policy is only proven by a container. The guard test reads
      # `nginx.conf` and the snippet as text; this step asserts what nginx
      # actually sends, on every route class, from the image Coolify builds.
      # Docker missing is an error rather than a skip: a silently skipped check
      # would make "every code change is validated" mean nothing, which is the
      # whole of AC-7. The image is built here, not reused, because a cache hit
      # from another job could hide a snippet the Dockerfile no longer copies.
      - name: Security headers
        if: steps.changes.outputs.tier == 'code'
        run: |
          command -v docker >/dev/null 2>&1 || { echo "::error::Docker is required to validate the security headers"; exit 1; }
          docker build -t aby-little-lab:headers .
          node scripts/validate-headers.js

  e2e-shard:
    # NFR-2's budget is 5 min for the suite, and one runner at two workers
    # measured 5.5-6.5 min on 2026-11-16 (runs 43950134928, 43951894620) while
    # three workers starved the game loop badly enough to kill the browser. The
    # roster is therefore split across this matrix: each half gets its own
    # four-vCPU runner, its own preview server and two workers, and
    # `--shard=i/2` is Playwright's own partition of the suite, so no spec file
    # can be dropped by a hand-kept list. Adding a third entry to `shard` is the
    # whole change if a half ever creeps past the budget again.
    name: Browser Journeys (${{ matrix.shard }}/${{ strategy.job-total }})
    # A separate job after the quality gates, not a step inside them, so a
    # browser failure does not hide static/unit results and a hung browser
    # cannot stall the gate. It still needs `dist`, which this job builds
    # itself (`pnpm build` below), keeping the artifact local to the job that
    # tests it. A documentation-only change runs no test here, but the job still
    # runs and still reports: both required checks must report or the PR stays
    # blocked.
    needs: quality-gates
    runs-on: ubuntu-latest
    # A hung browser should fail loudly instead of occupying a runner.
    timeout-minutes: 15
    strategy:
      # One half failing must not cancel the other: both are evidence.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Classify the change
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          emit() { echo "tier=$1" >> "$GITHUB_OUTPUT"; echo "Change tier: $1"; }
          if [ ! -f .node-version ]; then emit code; exit 0; fi
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "${base:-}" ]; then emit code; exit 0; fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then emit code; exit 0; fi
          fi
          files="$(git diff --name-only "$base" HEAD || true)"
          if [ -z "$files" ]; then emit code; exit 0; fi
          tier=doc
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              conductor/*|docs/*|README.md|*.md) ;;
              *) tier=code; break ;;
            esac
          done <<< "$files"
          emit "$tier"

      - name: Setup pnpm (from packageManager)
        uses: pnpm/action-setup@v6

      - name: Setup Node (from .node-version)
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.tier == 'code'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.changes.outputs.tier == 'code'
        run: pnpm exec playwright install --with-deps chromium

      # `pnpm test:e2e` runs the whole suite in one process; a shard runs the
      # same build and passes the partition Playwright computed for it.
      - name: Build the artifact
        if: steps.changes.outputs.tier == 'code'
        run: pnpm build

      - name: Browser journeys (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        if: steps.changes.outputs.tier == 'code'
        run: pnpm exec playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    # The check name branch protection requires, kept as one job so sharding
    # cannot quietly un-require the suite: it is green only when the gate passed
    # and every half of the roster did.
    name: Browser Journeys
    needs: [quality-gates, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every half must pass
        shell: bash
        run: |
          set -uo pipefail
          gate="${{ needs.quality-gates.result }}"
          halves="${{ needs.e2e-shard.result }}"
          echo "Quality Gates: $gate"
          echo "Browser journey halves: $halves"
          if [ "$gate" != "success" ]; then
            echo "::error::Quality Gates did not pass, so the browser journeys could not run"
            exit 1
          fi
          if [ "$halves" != "success" ]; then
            echo "::error::a browser journey half failed, failed to start, or was cancelled"
            exit 1
          fi

  deploy:
    name: Deploy to Coolify
    needs: quality-gates
    # Deploys only on strict semver version-tag pushes (e.g. v1.9.0), and only
    # if the tag points to a commit on master (master lineage guard below).
    # PRs and master pushes never deploy. Requires repository secrets:
    #   COOLIFY_DEPLOY_WEBHOOK - Coolify -> Application -> Webhooks -> Deploy Webhook URL
    #   COOLIFY_TOKEN         - Coolify -> Keys & Tokens -> API token with 'deploy' permission
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag points to a master commit
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit not on master; refusing to deploy."
            exit 1
          fi

      - name: Verify deploy secrets are configured
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: env.DEPLOY_WEBHOOK == '' || env.COOLIFY_TOKEN == ''
        run: |
          echo "::error title=Missing secrets::Set COOLIFY_DEPLOY_WEBHOOK (Coolify deploy webhook URL) and COOLIFY_TOKEN (Coolify API token with deploy permission) under Settings -> Secrets and variables -> Actions, then re-run this job."
          exit 1

      - name: Trigger Coolify deploy webhook
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "$DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
