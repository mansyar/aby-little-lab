name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore: ['conductor/**', 'docs/**', 'README.md', '**/*.md']

permissions:
  contents: read

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm (pinned to Dockerfile version)
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm run check

      - name: Tests
        run: CI=true pnpm test

      - name: Production build
        run: pnpm run build

      - name: Bundle validation
        run: node scripts/validate-bundle.js

      - name: PWA validation
        run: node scripts/validate-pwa.js

  deploy:
    name: Deploy to Coolify
    needs: quality-gates
    # Deploys only on strict semver version-tag pushes (e.g. v1.9.0), and only
    # if the tag points to a commit on master (master lineage guard below).
    # PRs and master pushes never deploy. Requires repository secrets:
    #   COOLIFY_DEPLOY_WEBHOOK - Coolify -> Application -> Webhooks -> Deploy Webhook URL
    #   COOLIFY_TOKEN         - Coolify -> Keys & Tokens -> API token with 'deploy' permission
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag points to a master commit
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit not on master; refusing to deploy."
            exit 1
          fi

      - name: Verify deploy secrets are configured
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        if: env.DEPLOY_WEBHOOK == '' || env.COOLIFY_TOKEN == ''
        run: |
          echo "::error title=Missing secrets::Set COOLIFY_DEPLOY_WEBHOOK (Coolify deploy webhook URL) and COOLIFY_TOKEN (Coolify API token with deploy permission) under Settings -> Secrets and variables -> Actions, then re-run this job."
          exit 1

      - name: Trigger Coolify deploy webhook
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request GET \
            --url "$DEPLOY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
